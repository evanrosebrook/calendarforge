<VirtualHost *:80>
    ServerName calendarforge.net
    ServerAlias www.calendarforge.net

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://calendarforge.net%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/calendarforge-error.log
    CustomLog ${APACHE_LOG_DIR}/calendarforge-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName calendarforge.net
    ServerAlias www.calendarforge.net

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^calendarforge\.net$ [NC]
    RewriteRule ^ https://calendarforge.net%{REQUEST_URI} [R=301,L,NE]

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=60 retry=0
    ProxyPassReverse / http://127.0.0.1:3000/

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/calendarforge.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/calendarforge.net/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/calendarforge-error.log
    CustomLog ${APACHE_LOG_DIR}/calendarforge-access.log combined
</VirtualHost>
</IfModule>
