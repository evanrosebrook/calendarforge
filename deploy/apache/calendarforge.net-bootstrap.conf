<VirtualHost *:80>
    ServerName calendarforge.net
    ServerAlias www.calendarforge.net

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=60 retry=0
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/calendarforge-error.log
    CustomLog ${APACHE_LOG_DIR}/calendarforge-access.log combined
</VirtualHost>
